name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pnpm/Node setup as ios-testflight.yml — keep versions in sync.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BLOCKING: unit tests (vitest) must pass.
      - name: Run tests (vitest)
        run: pnpm test

      - name: PostgreSQL party integration tests
        run: pnpm test:db

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Production build
        env:
          # Public client configuration is required even for static page rendering.
          # Fork PRs have no repository secrets; use an isolated local endpoint.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'ci-public-placeholder' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'ci-local' }}
        run: pnpm build

      # NON-BLOCKING (report only): lint still reports errors. Once
      # `pnpm lint` reaches 0 errors, remove `continue-on-error: true`
      # to make this step blocking.
      - name: Lint (eslint)
        continue-on-error: true
        run: pnpm lint
