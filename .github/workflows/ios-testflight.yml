name: iOS — Build & TestFlight

on:
  # Auto-upload only on explicit release tags: git tag v1.2.3 && git push --tags
  push:
    tags:
      - 'v*'
  # Manual trigger from GitHub Actions UI (Run workflow button)
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build only, skip TestFlight upload (useful for testing the pipeline)'
        type: boolean
        default: false

concurrency:
  group: ios-testflight
  cancel-in-progress: true

env:
  BUNDLE_ID: app.eventbliss
  XCODE_PROJECT: ios/App/App.xcodeproj
  XCODE_SCHEME: App

jobs:
  build:
    name: Build & Upload to TestFlight
    # macos-26 ships Xcode 26 / iOS 26 SDK — required by App Store Connect since
    # 2026 (uploads built with older SDKs are rejected: STATE_ERROR.VALIDATION_ERROR).
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Select Xcode
        run: |
          # Prefer Xcode 26 (iOS 26 SDK) required by App Store Connect; fall
          # back to whichever Xcode 26.x is the runner default.
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Ensure iOS platform (SDK) is installed
        run: |
          # Xcode 26 ships platforms as separate downloadable components. On the
          # macos-26 runner `xcodebuild -showsdks` lists iOS 26 but the platform
          # device-support component is incomplete, so archiving with
          # `-destination generic/platform=iOS` still fails with
          # "iOS 26.0 is not installed". Fetch it (idempotent when already there).
          #
          # `-downloadPlatform iOS` is flaky on the runner — it can exit 70 with
          # "Unable to connect to simulator" even though the SDK is fine. Retry a
          # few times, then only HARD-FAIL if the iphoneos SDK is genuinely absent.
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            sudo xcodebuild -downloadPlatform iOS && break
            echo "downloadPlatform attempt $i failed (likely the flaky simulator-connect error) — retrying in 20s…"
            sleep 20
          done
          echo "=== installed SDKs ==="
          xcodebuild -showsdks | grep -i ios || true
          if xcodebuild -showsdks | grep -qi "iphoneos"; then
            echo "iOS device SDK (iphoneos) present — continuing."
          else
            echo "::error::iOS device SDK still missing after retries"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (Capacitor mode)
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: pnpm run build

      - name: Fetch Spotify iOS SDK (App Remote framework)
        run: |
          set -e
          SDK_TAG=v5.0.1
          curl -L "https://github.com/spotify/ios-sdk/archive/refs/tags/${SDK_TAG}.tar.gz" -o /tmp/spotify-ios-sdk.tgz
          tar -xzf /tmp/spotify-ios-sdk.tgz -C /tmp
          DEST="node_modules/ohrwurm-spotify/ios/Frameworks"
          mkdir -p "$DEST"
          cp -R "/tmp/ios-sdk-${SDK_TAG#v}/SpotifyiOS.xcframework" "$DEST/"
          echo "SpotifyiOS.xcframework vendored into the plugin:"
          ls -la "$DEST"

      - name: Capacitor sync iOS
        run: pnpm exec cap sync ios

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import distribution certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install provisioning profile
          PP_PATH=$RUNNER_TEMP/distribution.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_PLIST=$(/usr/bin/security cms -D -i "$PP_PATH")
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PROFILE_PLIST")

          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision

          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "Installed provisioning profile: $PP_NAME ($PP_UUID)"

      - name: Set build number from run number
        run: |
          cd ios/App
          agvtool new-version -all ${{ github.run_number }}

      - name: Scope manual signing to App target
        # Global xcodebuild signing overrides break SPM package targets
        # ("X does not support provisioning profiles"), so patch the signing
        # settings into the App target's build configurations instead.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'EOF'
          import os, re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          team = os.environ["APPLE_TEAM_ID"]
          name = os.environ["PP_NAME"]
          ins = ('CODE_SIGN_STYLE = Manual;\n'
                 '\t\t\t\tDEVELOPMENT_TEAM = ' + team + ';\n'
                 '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n'
                 '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + name + '";')
          s2, n = re.subn(r'CODE_SIGN_STYLE = Automatic;', ins, s)
          assert n >= 2, f"expected >=2 app build configs, patched {n}"
          open(p, "w").write(s2)
          print(f"Patched manual signing into {n} build configurations")
          EOF

      - name: Build archive
        run: |
          set -o pipefail
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "build/ios/xcarchive/App.xcarchive" \
            -destination "generic/platform=iOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build/ios/xcarchive/archive.log

      - name: Create ExportOptions.plist
        run: |
          mkdir -p build/ios
          cat > build/ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key>
              <string>$PP_UUID</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          cat build/ios/ExportOptions.plist

      - name: Export IPA
        run: |
          mkdir -p build/ios/ipa
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "build/ios/xcarchive/App.xcarchive" \
            -exportPath "build/ios/ipa" \
            -exportOptionsPlist "build/ios/ExportOptions.plist" \
            2>&1 | tee build/ios/ipa/export.log
          echo "=== IPA produced ==="
          find build/ios/ipa -name "*.ipa" -exec ls -la {} \;

      - name: Upload to TestFlight
        if: ${{ inputs.skip_upload != true }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Write API key file for xcrun altool / xcodebuild upload
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          # Support both raw PEM and base64-encoded secret
          if echo "$APP_STORE_CONNECT_PRIVATE_KEY" | head -1 | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # altool can exit 0 even when validation fails (run 232: "train
          # version closed" errors, step still green) — parse the output and
          # fail the step explicitly on any upload error.
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee altool-output.log

          if grep -qE "UPLOAD FAILED|Validation failed|Failed to upload" altool-output.log; then
            echo "::error::TestFlight upload failed — see altool output above"
            exit 1
          fi

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12"
          rm -f "$RUNNER_TEMP/distribution.mobileprovision"
          rm -rf ~/private_keys

      - name: Upload IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build/ios/xcarchive/archive.log
            build/ios/ipa/export.log
            /tmp/xcodebuild_logs/*.log
          retention-days: 14
          if-no-files-found: warn
