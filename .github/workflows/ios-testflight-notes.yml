name: iOS TestFlight What's New

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Run number of the iOS Build & TestFlight upload workflow'
        required: true
        type: string
      prepare_store:
        description: 'Prepare App Store 1.6.1 with the build configured in release/app-store-1.6.1.json'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upload and verify localized TestFlight notes
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: node scripts/release/testflight-whats-new.mjs --build "$TESTFLIGHT_BUILD_NUMBER"
      - name: Prepare App Store release draft
        if: ${{ inputs.prepare_store == true }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node scripts/release/app-store-prepare.mjs
      - name: Audit App Store version readiness
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: node scripts/release/app-store-status.mjs
      - name: Upload App Store status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-status
          path: artifacts/app-store/status.json
          if-no-files-found: warn
